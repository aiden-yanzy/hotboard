# 接口 JSON 启用 gzip
#
# 背景：1Panel 全局 nginx.conf 的 gzip_types 只列了 text/plain、javascript、css、xml，
# 不含 application/json → /api/board 的 30–42KB 明文直传。
# 实测手机 4G（限速 180KB/s）单次切源：TTFB 100ms + 下载 956ms ≈ 1.06 秒，
# 其中 98% 的时间耗在这段未压缩的 JSON 上。压缩后约 7KB，下载降到 ~250ms。
#
# 该文件被 /www/sites/relabang.top/proxy/*.conf 在 server 层 include，
# 所以这里的 gzip_types 会覆盖全局列表，需要把常用类型一并列出。

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_min_length   512;
gzip_comp_level   5;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xhtml+xml
    application/rss+xml
    application/manifest+json
    text/plain
    text/css
    text/javascript
    text/xml
    image/svg+xml;
